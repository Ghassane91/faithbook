server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Les captures peuvent etre volumineuses (page entiere).
    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # L'API est relayee vers le backend : le navigateur ne connait qu'une
    # seule origine, donc aucune URL a configurer et aucun souci de CORS.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Une capture peut prendre une minute : ne pas couper trop tot.
        proxy_read_timeout 120s;
    }

    # Sous-requetes internes d'autorisation (jamais appelees par le client :
    # "internal" les rend inatteignables depuis l'exterieur). nginx transmet
    # le Cookie du client par heritage ; on force aussi X-Api-Key pour les
    # scripts machine-a-machine qui n'ont pas de cookie de session.
    location = /internal/auth-check {
        internal;
        proxy_pass http://backend:8000/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Api-Key $http_x_api_key;
    }

    location = /internal/novnc-auth {
        internal;
        proxy_pass http://backend:8000/api/accounts/novnc/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # Ecran de connexion manuelle (noVNC). Le prefixe /novnc/ est retire :
    # /novnc/vnc.html -> backend:6080/vnc.html, /novnc/websockify -> .../websockify.
    # La connexion WebSocket exige l'upgrade explicite du protocole.
    # auth_request : sans session FaithBook valide ET sans le jeton noVNC
    # (cookie pose par POST /api/accounts/{id}/login/start), acces refuse (403)
    # avant meme d'atteindre l'ecran de connexion — personne ne peut voir ou
    # piloter le navigateur d'un autre utilisateur.
    location /novnc/ {
        auth_request /internal/novnc-auth;
        proxy_pass http://backend:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # La session de login reste ouverte plusieurs minutes : ne pas couper.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebSocket du client noVNC. noVNC 1.3.0 construit l'URL à la RACINE
    # (ws://<hote>/websockify), pas sous /novnc/ : ce relais dédié est donc
    # indispensable, en plus de /novnc/ qui sert les fichiers du client.
    location = /websockify {
        auth_request /internal/novnc-auth;
        proxy_pass http://backend:6080/websockify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Documentation API : divulgue le schema complet, protegee derriere une
    # session valide (ou une cle API pour les integrations).
    location /docs      { auth_request /internal/auth-check; proxy_pass http://backend:8000/docs; }
    location /redoc     { auth_request /internal/auth-check; proxy_pass http://backend:8000/redoc; }
    location /openapi.json { auth_request /internal/auth-check; proxy_pass http://backend:8000/openapi.json; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application monopage : toute autre route retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
