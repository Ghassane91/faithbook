server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Les captures peuvent etre volumineuses (page entiere).
    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # L'API est relayee vers le backend : le navigateur ne connait qu'une
    # seule origine, donc aucune URL a configurer et aucun souci de CORS.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Une capture peut prendre une minute : ne pas couper trop tot.
        proxy_read_timeout 120s;
    }

    # Ecran de connexion manuelle (noVNC). Le prefixe /novnc/ est retire :
    # /novnc/vnc.html -> backend:6080/vnc.html, /novnc/websockify -> .../websockify.
    # La connexion WebSocket exige l'upgrade explicite du protocole.
    location /novnc/ {
        proxy_pass http://backend:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # La session de login reste ouverte plusieurs minutes : ne pas couper.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebSocket du client noVNC. noVNC 1.3.0 construit l'URL à la RACINE
    # (ws://<hote>/websockify), pas sous /novnc/ : ce relais dédié est donc
    # indispensable, en plus de /novnc/ qui sert les fichiers du client.
    location = /websockify {
        proxy_pass http://backend:6080/websockify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /docs      { proxy_pass http://backend:8000/docs; }
    location /redoc     { proxy_pass http://backend:8000/redoc; }
    location /openapi.json { proxy_pass http://backend:8000/openapi.json; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application monopage : toute autre route retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
